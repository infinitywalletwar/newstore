version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # .NET 11 is one deliberate move (#92); until then no semver-major bump of the .NET packages.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directories: ["/src/Services/*"]
    schedule:
      interval: "weekly"
    # Same rule for the .NET images: the move to .NET 11 is #92.
    ignore:
      # Dependabot drops the registry: PRs #81 and #82 were "Bump dotnet/aspnet" and "Bump dotnet/sdk".
      # The full form stays in case a run ever reports it.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    # SDK 11 is the move in #92; this ecosystem tracks a single dependency, so "*" matches it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
