name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Every project is in the solution
        # `dotnet test --solution` skips a project the solution does not list; a merge once dropped one.
        run: diff <(find src tests -name '*.csproj' | sort) <(grep -o 'Path="[^"]*\.csproj"' NewStore.slnx | sed 's/^Path="//; s/"$//' | sort)
      - run: dotnet restore NewStore.slnx
      - run: dotnet format NewStore.slnx --verify-no-changes --no-restore
      - run: dotnet build NewStore.slnx -c Release --no-restore
      - run: dotnet test --solution NewStore.slnx -c Release --no-build

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: docker compose -f compose.yaml -f compose.load.yaml up --build --detach --wait --wait-timeout 240
      - name: Catalog is ready
        # --wait already waited for Catalog's health check; the retry is a second line of defence.
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8101/health/ready
      - name: Inventory is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8102/health/ready
      - name: Orders is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8103/health/ready
      - name: Payments is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8104/health/ready
      - name: FakePay is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8105/health/ready
      - name: Media is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8106/health/ready
      - name: Gateway is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8100/health/ready
      - name: Floci is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:4566/_floci/health
      - name: Keycloak issues a service token
        # The secret comes from the realm file Keycloak imported, so the file and the running server cannot disagree unnoticed.
        run: |
          secret=$(jq -r '.clients[] | select(.clientId == "orders") | .secret' deploy/compose/keycloak/newstore-realm.json)
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --data grant_type=client_credentials --data client_id=orders --data-urlencode "client_secret=$secret" \
            http://localhost:8180/realms/newstore/protocol/openid-connect/token | jq -e '.access_token | length > 0'
      - name: Show the runner's CPU
        # Reserve latency in this job ranged 2.3 to 5.6 s on the same code (#102); the CPU model and count show whether the slow
        # runs come from slower runners.
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'
      - name: Run the last-copy load test
        # The runner is slower than the Mac, so the latency threshold is looser (tests/load/README.md).
        run: docker compose -f compose.yaml -f compose.load.yaml run --rm k6
        env:
          # The runner is slower and noisier than the Mac (same-code runs vary 1.6 to 2.8 s), so this guards against gross
          # regressions only; the rule on the Mac is 1 s (tests/load/README.md). The burst's bound is soft by design and its p99
          # ranged 2.3 to 5.6 s on the same code (#102), so it is looser than the steady load's, the rule.
          P99_MS: "3500"
          BURST_P99_MS: "8000"
      - name: Catalog finds the seeded video
        run: curl --fail --silent --show-error 'http://localhost:8101/videos?q=sourdough' | grep -q '"total":1'
      - name: Gateway forwards a search to Catalog
        run: curl --fail --silent --show-error 'http://localhost:8100/api/videos?q=sourdough' | grep -q '"total":1'
      - name: Catalog lists the seeded edition of a sample video
        # The snapshot travels Inventory, Kafka, Catalog: retry for up to 30 s. The k6 step above also creates Digital editions of
        # this video (10 copies each), so the check looks for what only the seeded edition has: 1000 copies.
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error 'http://localhost:8101/videos/00000000-0000-7000-8001-000000000011/editions' | grep -q '"copiesTotal":1000'; then
              exit 0
            fi
            sleep 2
          done
          echo "The sample video has no seeded edition (1000 copies) after 30 s" >&2
          exit 1
      - name: Show logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.load.yaml logs
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.load.yaml down --volumes

  # The browser test (tests/e2e). It runs on the base stack, with the real reservation TTL, so it cannot share compose-smoke's
  # stack with the load overlay's 30-second TTL. The owner's rule is no browser on the Mac, so this job is the only place it runs.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Gateway is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8100/health/ready
      - name: Orders is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8103/health/ready
      - name: FakePay is ready
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8105/health/ready
      - name: Catalog lists the seeded edition of the sample video
        # The snapshot travels Inventory, Kafka, Catalog. Without the wait the video page can list no edition when the test opens it.
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error 'http://localhost:8101/videos/00000000-0000-7000-8001-000000000011/editions' | grep -q '"copiesTotal":1000'; then
              exit 0
            fi
            sleep 2
          done
          echo "The sample video has no seeded edition (1000 copies) after 30 s" >&2
          exit 1
      - name: Install the test and Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser test
        working-directory: tests/e2e
        run: npx playwright test
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color > compose.log; tail -n 400 compose.log
      - name: Upload the stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose.log
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
