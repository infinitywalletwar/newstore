name: newstore

services:
  postgres:
    image: postgres:18.6
    # Connection budget: see ADR 0002.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql   # PostgreSQL 18 moved its volume here from /var/lib/postgresql/data
      - ./deploy/compose/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP: while init.sql runs, the entrypoint's temporary server listens only on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }

  kafka:
    image: apache/kafka:4.4.0
    ports: ["127.0.0.1:9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    deploy: { resources: { limits: { memory: 1g } } }

  redis:
    image: redis:8.10.3
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 256m } } }

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      # Browsers get front-channel URLs on localhost:8180, containers get back-channel URLs on keycloak:8080,
      # and every token carries the one public issuer (ADR 0012).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/compose/keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      # The image has no curl, so the check speaks HTTP to the management port through bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy: { resources: { limits: { memory: 1g } } }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    volumes:
      - ./deploy/compose/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    deploy: { resources: { limits: { memory: 256m } } }

  # The local S3 (ADR 0018). Signature checks are on, so a presigned URL is verified as AWS would verify it. The credentials are
  # Floci's own: access key test, secret test.
  floci:
    image: floci/floci:2.4.0
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"
      FLOCI_SERVICES_UI_ENABLED: "false"
    volumes: [floci-data:/app/data]
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      # No curl or grep in the image: bash reads the status line. $$ stops Compose from interpolating.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_floci/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }

  # One-shot job: applies Catalog's migrations, seeds the sample catalog and exits (ADR 0005). The image's entrypoint is
  # `dotnet NewStore.Catalog.dll`, so `command` supplies the argument.
  catalog-migrate:
    build:
      context: .
      dockerfile: src/Services/Catalog/Dockerfile
    image: newstore/catalog:local
    pull_policy: build
    command: ["migrate", "seed"]
    restart: "no"
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=catalog;Username=catalog;Password=catalog
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: catalog
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }

  catalog:
    build:
      context: .
      dockerfile: src/Services/Catalog/Dockerfile
    image: newstore/catalog:local
    pull_policy: build
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=catalog;Username=catalog;Password=catalog
      ConnectionStrings__Redis: redis:6379
      Messaging__BootstrapServers: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: catalog
      # Tokens carry the public issuer; the keys come from the address a container can reach (ADR 0012).
      Auth__Issuer: http://localhost:8180/realms/newstore
      Auth__MetadataAddress: http://keycloak:8080/realms/newstore/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
    ports: ["127.0.0.1:8101:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      catalog-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      # The runtime image has bash but no curl, so the probe speaks HTTP through /dev/tcp, as Keycloak's does.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: { resources: { limits: { memory: 512m } } }

  # One-shot job: applies Inventory's migrations and exits (ADR 0005). The image's entrypoint is
  # `dotnet NewStore.Inventory.dll`, so `command` supplies the argument.
  inventory-migrate:
    build:
      context: .
      dockerfile: src/Services/Inventory/Dockerfile
    image: newstore/inventory:local
    pull_policy: build
    command: ["migrate", "seed"]
    restart: "no"
    environment:
      ConnectionStrings__Inventory: Host=postgres;Database=inventory;Username=inventory;Password=inventory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: inventory
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }

  inventory:
    build:
      context: .
      dockerfile: src/Services/Inventory/Dockerfile
    image: newstore/inventory:local
    pull_policy: build
    environment:
      ConnectionStrings__Inventory: Host=postgres;Database=inventory;Username=inventory;Password=inventory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: inventory
      Messaging__BootstrapServers: kafka:9092
      # Tokens carry the public issuer; the keys come from the address a container can reach (ADR 0012).
      Auth__Issuer: http://localhost:8180/realms/newstore
      Auth__MetadataAddress: http://keycloak:8080/realms/newstore/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      # Inventory asks Catalog who owns a video, with its own client's token (ADR 0012, ADR 0016).
      Auth__ClientId: inventory
      Auth__ClientSecret: inventory
      Auth__TokenEndpoint: http://keycloak:8080/realms/newstore/protocol/openid-connect/token
      Services__Catalog: http://catalog:8080
    ports: ["127.0.0.1:8102:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      inventory-migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      catalog: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      # The runtime image has bash but no curl, so the probe speaks HTTP through /dev/tcp, as Keycloak's does.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: { resources: { limits: { memory: 512m } } }

  # The backend for the browser: signs it in to Keycloak, keeps the session in Redis and forwards /api calls with the user's
  # access token (ADR 0015).
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    image: newstore/gateway:local
    pull_policy: build
    environment:
      ConnectionStrings__Redis: redis:6379
      # Browsers are sent to the public issuer; the gateway itself fetches discovery and keys from the keycloak container (ADR 0012).
      Oidc__Authority: http://localhost:8180/realms/newstore
      Oidc__MetadataAddress: http://keycloak:8080/realms/newstore/.well-known/openid-configuration
      Oidc__ClientId: gateway
      Oidc__ClientSecret: gateway
      Oidc__RequireHttpsMetadata: "false"
      Auth__Issuer: http://localhost:8180/realms/newstore
      Auth__MetadataAddress: http://keycloak:8080/realms/newstore/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      Services__Catalog: http://catalog:8080
      Services__Inventory: http://inventory:8080
      Services__Orders: http://orders:8080
      Services__Media: http://media:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: gateway
    ports: ["127.0.0.1:8100:8080"]
    depends_on:
      keycloak: { condition: service_healthy }
      redis: { condition: service_healthy }
      catalog: { condition: service_healthy }
      inventory: { condition: service_healthy }
      orders: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      # The runtime image has bash but no curl, so the probe speaks HTTP through /dev/tcp, as Keycloak's does.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: { resources: { limits: { memory: 512m } } }

  # One-shot job: applies Payments' migrations and exits (ADR 0005). The image's entrypoint is
  # `dotnet NewStore.Payments.dll`, so `command` supplies the argument.
  payments-migrate:
    build:
      context: .
      dockerfile: src/Services/Payments/Dockerfile
    image: newstore/payments:local
    pull_policy: build
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Payments: Host=postgres;Database=payments;Username=payments;Password=payments
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: payments
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }

  payments:
    build:
      context: .
      dockerfile: src/Services/Payments/Dockerfile
    image: newstore/payments:local
    pull_policy: build
    environment:
      ConnectionStrings__Payments: Host=postgres;Database=payments;Username=payments;Password=payments
      Messaging__BootstrapServers: kafka:9092
      # Tokens carry the public issuer; the keys are fetched on the internal address (ADR 0012).
      Auth__Audience: payments
      Auth__MetadataAddress: http://keycloak:8080/realms/newstore/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      Payments__Provider__BaseUrl: http://fakepay:8080
      Payments__Provider__ApiKey: fakepay
      Payments__Provider__WebhookSecret: fakepay-webhook
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: payments
    ports: ["127.0.0.1:8104:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      payments-migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      # The runtime image has bash but no curl, so the probe speaks HTTP through /dev/tcp, as Keycloak's does.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: { resources: { limits: { memory: 512m } } }

  # One-shot job: applies Orders' migrations and exits (ADR 0005).
  orders-migrate:
    build:
      context: .
      dockerfile: src/Services/Orders/Dockerfile
    image: newstore/orders:local
    pull_policy: build
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=orders;Password=orders
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: orders
    depends_on:
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }

  # The checkout saga (ADR 0017): reserves through Inventory, creates the payment at Payments, and reacts to Payments' events.
  orders:
    build:
      context: .
      dockerfile: src/Services/Orders/Dockerfile
    image: newstore/orders:local
    pull_policy: build
    environment:
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=orders;Password=orders
      Messaging__BootstrapServers: kafka:9092
      # Tokens carry the public issuer; the keys are fetched on the internal address (ADR 0012).
      Auth__Issuer: http://localhost:8180/realms/newstore
      Auth__MetadataAddress: http://keycloak:8080/realms/newstore/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      # Orders' own client, for calls to Inventory and Payments.
      Auth__ClientId: orders
      Auth__ClientSecret: orders
      Auth__TokenEndpoint: http://keycloak:8080/realms/newstore/protocol/openid-connect/token
      Services__Inventory: http://inventory:8080
      Services__Payments: http://payments:8080
      # The provider's page sends the buyer back here: the gateway serves the app (ADR 0015).
      Orders__WebBaseUrl: http://localhost:8100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: orders
    ports: ["127.0.0.1:8103:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      orders-migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      inventory: { condition: service_healthy }
      payments: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      # The runtime image has bash but no curl, so the probe speaks HTTP through /dev/tcp, as Keycloak's does.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: { resources: { limits: { memory: 512m } } }

  # A stand-in for a hosted payment page such as Stripe's (ADR 0014). Not a store service: no database, no outbox.
  # The browser reaches it on localhost:8105; it calls Payments' webhook on the Compose network.
  fakepay:
    build:
      context: .
      dockerfile: src/Fakes/FakePay/Dockerfile
    image: newstore/fakepay:local
    pull_policy: build
    environment:
      FakePay__ApiKey: fakepay
      FakePay__WebhookSecret: fakepay-webhook
      FakePay__WebhookUrl: http://payments:8080/webhooks/fakepay
      FakePay__PublicBaseUrl: http://localhost:8105
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: fakepay
    ports: ["127.0.0.1:8105:8080"]
    depends_on:
      otel-collector: { condition: service_started }
    healthcheck:
      # The runtime image has bash but no curl, so the probe speaks HTTP through /dev/tcp, as Keycloak's does.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy: { resources: { limits: { memory: 256m } } }

volumes:
  postgres-data:
  floci-data:
