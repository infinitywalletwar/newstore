# Overlay for the last-copy load test (tests/load/README.md):
#   docker compose -f compose.yaml -f compose.load.yaml up -d --wait
#   docker compose -f compose.yaml -f compose.load.yaml run --rm k6
# It shortens Inventory's reservation TTL to 30 s (so the expiry scenario runs in half a minute), lets the k6 client in at the
# gateway, Orders and Inventory, and switches on FakePay's test endpoints. Never use it as a base stack.
#
# The TTL has one source, RESERVATION_TTL_SECONDS (default 30, below 60 because it is written as 00:00:SS). Inventory gets it as a
# TimeSpan and k6 as a number of seconds, so the expiry scenario's wait and the steady scenario's start cannot drift from it.
# Why 30 s: Orders reserves in Inventory first and saves its own order after, so a winner's 201 comes later than the hold. On a
# slow CI runner the burst's reserve took up to 5.6 s, longer than the old 3 s TTL, and the winners' Pay found the hold swept
# (#102). Passing runs still left the winners under a second of margin. 30 s is several times the slowest reserve seen.
services:
  inventory:
    environment:
      Inventory__ReservationTtl: "00:00:${RESERVATION_TTL_SECONDS:-30}"
      Inventory__ExpirySweepInterval: "00:00:01" # last-copy.js assumes 1 s (SWEEP_SECONDS)
      Inventory__ReserveStrategy: ${RESERVE_STRATEGY:-ConditionalUpdate}
      # The k6 client (tests/load/keycloak.js) signs users in like the gateway does, so every service that checks a user's
      # token takes it as a second user client.
      Auth__UserClients__1: k6

  orders:
    environment:
      Auth__UserClients__1: k6

  gateway:
    environment:
      Auth__UserClients__1: k6

  # The winners pay through FakePay's test endpoint, which is off unless this is set.
  fakepay:
    environment:
      FakePay__EnableTestEndpoints: "true"

  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    volumes: ["./tests/load:/scripts:ro"]
    command: ["run", "/scripts/last-copy.js", "-e", "BASE_URL=http://gateway:8080", "-e", "P99_MS=${P99_MS:-1000}", "-e", "BURST_P99_MS=${BURST_P99_MS:-3000}", "-e", "RESERVATION_TTL_SECONDS=${RESERVATION_TTL_SECONDS:-30}", "--summary-trend-stats=med,p(95),p(99),max"]
    environment:
      FAKEPAY_URL: http://fakepay:8080
      # setup() creates the client `k6` and the buyers through the admin API, with Keycloak's local admin (AGENTS.md).
      KEYCLOAK_URL: http://keycloak:8080
      # The sample creator `orbital-kitchen` signs in to create the test editions; a sample user's password equals its username (AGENTS.md).
      CREATOR_PASSWORD: orbital-kitchen
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      gateway: { condition: service_healthy }
      orders: { condition: service_healthy }
      inventory: { condition: service_healthy }
      fakepay: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    # 1,610 VUs (1,010 for the burst plus 600 preallocated for the steady load) each keep a token and sockets: the peak was 613 MiB
    # in one run with `docker stats` sampled every 2 s (60 % of the limit; the burst alone was about 380 MiB, tests/load/README.md).
    deploy: { resources: { limits: { memory: 1g } } }
