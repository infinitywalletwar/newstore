# Overlay for the last-copy load test (tests/load/README.md):
#   docker compose -f compose.yaml -f compose.load.yaml up -d --wait
#   docker compose -f compose.yaml -f compose.load.yaml run --rm k6
# It shortens Inventory's reservation TTL, so the expiry scenario can run in seconds. Never use it as a base stack.
services:
  inventory:
    environment:
      Inventory__ReservationTtl: "00:00:03"
      Inventory__ExpirySweepInterval: "00:00:01"
      Inventory__ReserveStrategy: ${RESERVE_STRATEGY:-ConditionalUpdate}
      # The k6 client (tests/load/keycloak.js) signs users in like the gateway does, so Inventory takes it as a second user client.
      Auth__UserClients__1: k6

  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    volumes: ["./tests/load:/scripts:ro"]
    command: ["run", "/scripts/last-copy.js", "-e", "BASE_URL=http://inventory:8080", "-e", "P99_MS=${P99_MS:-1000}"]
    environment:
      # The secret of the realm's `orders` client, which equals its id (local-only, AGENTS.md). k6 trades it for a token.
      ORDERS_CLIENT_SECRET: orders
      TOKEN_URL: http://keycloak:8080/realms/newstore/protocol/openid-connect/token
      # setup() creates the client `k6` through the admin API, with Keycloak's local admin (AGENTS.md).
      KEYCLOAK_URL: http://keycloak:8080
      # The sample creator `orbital-kitchen` signs in to create the test editions; a sample user's password equals its username (AGENTS.md).
      CREATOR_PASSWORD: orbital-kitchen
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      inventory: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512m } } }
